 fill="#fff" font-size="15" font-weight="600">Spec v2</text><text x="514" y="150" fill="#9a9a9a" font-size="12">document</text><g font-size="11" text-anchor="middle"><circle cx="483" cy="190" r="13" fill="#27272a" stroke="#3f3f46"/><text x="483" y="194" fill="#e8e8e8">A</text><circle cx="511" cy="190" r="13" fill="#27272a" stroke="#3f3f46"/><text x="511" y="194" fill="#e8e8e8">B</text><circle cx="539" cy="190" r="13" fill="#27272a" stroke="#3f3f46"/><text x="539" y="194" fill="#e8e8e8">C</text></g><text x="564" y="194" fill="#9a9a9a" font-size="12">can all open it</text><line x1="40" x2="720" y1="312" y2="312" stroke="#242424"/><g font-size="13"><circle cx="60" cy="348" r="13" fill="#241606" stroke="#ff8f05"/><text x="60" y="352" fill="#ff8f05" font-size="11" text-anchor="middle">D</text><text x="84" y="345" fill="#e8e8e8">Dana joins #design</text><text x="84" y="363" fill="#9a9a9a" font-size="12">instantly gets access to everything shared in it</text></g><g font-size="13"><circle cx="420" cy="348" r="13" fill="#1a1a1a" stroke="#3f3f46" stroke-dasharray="3 3"/><text x="420" y="352" fill="#6f6f6f" font-size="11" text-anchor="middle">B</text><text x="444" y="345" fill="#e8e8e8">Ben leaves</text><text x="444" y="363" fill="#9a9a9a" font-size="12">access to shared items is removed</text></g></svg>