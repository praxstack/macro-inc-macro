<svg xmlns="http://www.w3.org/2000/svg" style="background:0 0" viewBox="0 0 32 32"><style>@keyframes flick{0%{opacity:1}71%{opacity:0}}.px{fill:currentColor;pointer-events:none}.a{animation-timing-function:steps(1,end);animation-iteration-count:infinite}</style><defs><rect id="pixel" width="10" height="10" class="px a" rx="7.5" ry="7.5"/></defs><use style="animation:flick .45s infinite;animation-delay:.21s" x="0" y="0" href="#pixel"/><use style="animation:flick .73s infinite;animation-delay:.01s" x="11" y="0" href="#pixel"/><use style="animation:flick .42s infinite;animation-delay:.01s" x="22" y="0" href="#pixel"/><use style="animation:flick .67s infinite;animation-delay:.15s" x="0" y="11" href="#pixel"/><use style="animation:flick .72s infinite;animation-delay:.2s" x="11" y="11" href="#pixel"/><use style="animation:flick .53s infinite;animation-delay:.05s" x="22" y="11" href="#pixel"/><use style="animation:flick .51s infinite;animation-delay:.2s" x="0" y="22" href="#pixel"/><use style="animation:flick .74s infinite;animation-delay:.04s" x="11" y="22" href="#pixel"/><use style="animation:flick .53s infinite;animation-delay:.01s" x="22" y="22" href="#pixel"/></svg>